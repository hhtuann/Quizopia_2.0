openapi: 3.1.0
info:
  title: Quizopia W3-M1 activity evidence
  version: 1.0.0
  description:
    Implemented default-disabled M1 increment. Browser signals are untrusted
    observations, never authoritative answers or misconduct findings. M2 media APIs
    and authoritative Assessment change-event adapter are not included. Production
    activation remains prohibited pending bundle/privacy/security gates. Replay uses
    exact canonical event identity; client observedAt is normalized to PostgreSQL
    microseconds. Session END is irreversible. A prior acknowledgment may replay after
    END with fresh resource authority. Remote authority is an in-flight sample, not
    a distributed transaction.
