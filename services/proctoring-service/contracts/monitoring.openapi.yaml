components:
  securitySchemes:
    userBearer:
      type: http
      scheme: bearer
      bearerFormat: Quizopia RS256 USER JWT
  schemas:
    Create:
      type: object
      additionalProperties: false
      required:
        - attemptId
      properties:
        attemptId:
          type: string
          format: uuid
    Session:
      type: object
      additionalProperties: false
      required:
        - id
        - attemptId
        - publicationId
        - classroomId
        - studentId
        - deadlineAt
        - status
        - createdAt
        - endedAt
      properties:
        id:
          type: string
          format: uuid
        attemptId:
          type: string
          format: uuid
        publicationId:
          type: string
          format: uuid
        classroomId:
          type: string
          format: uuid
        studentId:
          type: string
          format: uuid
        deadlineAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - ACTIVE
            - ENDED
        createdAt:
          type: string
          format: date-time
        endedAt:
          type:
            - string
            - "null"
          format: date-time
    Event:
      type: object
      additionalProperties: false
      required:
        - eventId
        - streamId
        - sequence
        - type
        - schemaVersion
      properties:
        eventId:
          type: string
          format: uuid
        streamId:
          type: string
          format: uuid
        sequence:
          type: integer
          format: int64
          minimum: 0
        type:
          type: string
          enum:
            - QUESTION_VIEWED
            - QUESTION_LEFT
            - ANSWER_SELECTED
            - ANSWER_CHANGED
            - ANSWER_CLEARED
            - VISIBILITY_HIDDEN
            - VISIBILITY_VISIBLE
            - WINDOW_BLUR
            - WINDOW_FOCUS
            - FULLSCREEN_ENTERED
            - FULLSCREEN_EXITED
            - CAMERA_PERMISSION_GRANTED
            - CAMERA_PERMISSION_DENIED
            - DEVICE_MISSING
            - DEVICE_ERROR
            - CAMERA_UNAVAILABLE
            - MEDIA_DISCONNECTED
            - RECONNECTING
            - NETWORK_DISCONNECTED
            - NETWORK_RECONNECTED
            - DUPLICATE_TAB
        observedAt:
          type:
            - string
            - "null"
          format: date-time
        questionNumber:
          type:
            - integer
            - "null"
          minimum: 1
        schemaVersion:
          type: integer
          const: 1
      allOf:
        - if:
            properties:
              type:
                enum:
                  - QUESTION_VIEWED
                  - QUESTION_LEFT
                  - ANSWER_SELECTED
                  - ANSWER_CHANGED
                  - ANSWER_CLEARED
          then:
            required:
              - questionNumber
            properties:
              questionNumber:
                type: integer
                minimum: 1
          else:
            properties:
              questionNumber:
                type: "null"
    Acknowledgment:
      type: object
      additionalProperties: false
      required:
        - id
        - ordinal
        - receivedAt
      properties:
        id:
          type: string
          format: uuid
        ordinal:
          type: integer
          format: int64
          minimum: 1
        receivedAt:
          type: string
          format: date-time
    Evidence:
      type: object
      additionalProperties: false
      required:
        - ordinal
        - id
        - streamId
        - sequence
        - type
        - observedAt
        - questionNumber
        - receivedAt
        - source
        - integritySha256
        - schemaVersion
        - actorId
      properties:
        ordinal:
          type: integer
          format: int64
          minimum: 1
        id:
          type: string
          format: uuid
        streamId:
          type:
            - string
            - "null"
          format: uuid
        sequence:
          type:
            - integer
            - "null"
          format: int64
          minimum: 0
        type:
          type: string
          enum:
            - QUESTION_VIEWED
            - QUESTION_LEFT
            - ANSWER_SELECTED
            - ANSWER_CHANGED
            - ANSWER_CLEARED
            - VISIBILITY_HIDDEN
            - VISIBILITY_VISIBLE
            - WINDOW_BLUR
            - WINDOW_FOCUS
            - FULLSCREEN_ENTERED
            - FULLSCREEN_EXITED
            - CAMERA_PERMISSION_GRANTED
            - CAMERA_PERMISSION_DENIED
            - DEVICE_MISSING
            - DEVICE_ERROR
            - CAMERA_UNAVAILABLE
            - MEDIA_DISCONNECTED
            - RECONNECTING
            - NETWORK_DISCONNECTED
            - NETWORK_RECONNECTED
            - DUPLICATE_TAB
            - SESSION_STARTED
            - SESSION_ENDED
        observedAt:
          type:
            - string
            - "null"
          format: date-time
        questionNumber:
          type:
            - integer
            - "null"
          minimum: 1
        receivedAt:
          type: string
          format: date-time
        source:
          type: string
          enum:
            - CLIENT_OBSERVATION
            - SERVER_AUTHORITY
        integritySha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        schemaVersion:
          type: integer
          const: 1
        actorId:
          type: string
          format: uuid
    Page:
      type: object
      additionalProperties: false
      required:
        - items
        - nextAfter
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/Evidence"
        nextAfter:
          type:
            - integer
            - "null"
          format: int64
          minimum: 1
    Error:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        code:
          type: string
          enum:
            - UNAUTHENTICATED
            - ACCESS_DENIED
            - INVALID_REQUEST
            - PROCTORING_NOT_ACCESSIBLE
            - SESSION_ENDED
            - EVENT_CONFLICT
            - PAYLOAD_TOO_LARGE
            - AUTHORITY_UNAVAILABLE
            - PERSISTENCE_UNAVAILABLE
            - EVIDENCE_INTEGRITY_UNAVAILABLE
