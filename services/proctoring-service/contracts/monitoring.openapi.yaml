        Implemented default-disabled M1 adapter, pending independent review.
        Fresh Gateway and downstream Identity admission plus Assessment/Classroom
        authority required. No USER/SERVICE role substitution. No positive eligibility
        cache. All responses are sanitized and no-store.
      responses:
        "200":
          description: Authorized result
          headers:
            Cache-Control:
              schema:
                type: string
