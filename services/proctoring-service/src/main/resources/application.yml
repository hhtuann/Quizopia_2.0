spring:
  application:
    name: quizopia-proctoring-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  main:
    web-application-type: servlet
  datasource:
    hikari:
      connection-timeout: 3000
      validation-timeout: 1000
      data-source-properties:
        socketTimeout: 5
        loginTimeout: 3
    url: ${DB_URL:jdbc:postgresql://localhost:5432/proctoring_db}
    username: ${DB_USERNAME:proctoring}
    password: ${DB_PASSWORD:proctoring_local_only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    # FB-015 H1: migrations run as the owner-member migration role (never the
    # runtime role) so V5 can transfer ownership and enforce least privilege.
    user: ${FLYWAY_USERNAME:quizopia_proctoring_flyway}
    password: ${FLYWAY_PASSWORD:proctoring_flyway_local_only}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8081/oauth2/jwks}
          issuer-uri: ${IDENTITY_ISSUER:http://localhost:8081}
server:
  port: ${SERVER_PORT:8086}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  tracing:
    export:
      otlp:
        enabled: ${OTEL_EXPORTER_OTLP_ENABLED:false}
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_ARG:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:true}
quizopia:
  # FB-015 PR C quiz-ID revocation fence + dependent purge (ADR-018). Gate enforcement in
  # monitoring/media stores is always compiled and table-driven; this flag gates only the
  # private command endpoint, background acknowledgment and purge entry points.
  deletion:
    enabled: ${PROCTORING_DELETION_ENABLED:false}
    quiz-service-client-id: ${PROCTORING_DELETION_QUIZ_CLIENT_ID:quiz-service}
    allow-insecure-loopback: ${PROCTORING_DELETION_ALLOW_INSECURE_LOOPBACK:false}
    max-concurrent: ${PROCTORING_DELETION_MAX_CONCURRENT:8}
    requests-per-minute: ${PROCTORING_DELETION_REQUESTS_PER_MINUTE:30}
    ack-poll-delay-seconds: ${PROCTORING_DELETION_ACK_POLL_DELAY_SECONDS:10}
    ack-batch-size: ${PROCTORING_DELETION_ACK_POLL_BATCH_SIZE:20}
    purge-budget: ${PROCTORING_DELETION_PURGE_BUDGET:5000}
  admission:
    enabled: ${USER_ADMISSION_ENABLED:false}
    identity-base-url: ${USER_ADMISSION_IDENTITY_BASE_URL:}
    client-id: ${USER_ADMISSION_CLIENT_ID:}
    client-secret: ${USER_ADMISSION_CLIENT_SECRET:}
    allow-insecure-loopback: ${USER_ADMISSION_ALLOW_INSECURE_LOOPBACK:false}
    connect-timeout: ${USER_ADMISSION_CONNECT_TIMEOUT:PT1S}
    response-timeout: ${USER_ADMISSION_RESPONSE_TIMEOUT:PT3S}
    total-timeout: ${USER_ADMISSION_TOTAL_TIMEOUT:PT5S}
    max-connections: ${USER_ADMISSION_MAX_CONNECTIONS:8}
    pending-acquires: ${USER_ADMISSION_PENDING_ACQUIRES:32}
  proctoring:
    livekit:
      url: ${LIVEKIT_URL:http://localhost:7880}
      api-key: ${LIVEKIT_API_KEY:devkey}
      api-secret: ${LIVEKIT_API_SECRET:secret-dev-only}

# Dedicated credential clients must remain redacted even when root logging is DEBUG/TRACE.
logging:
  level:
    org.apache.coyote.http11: WARN
    org.hibernate.orm.factory: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.springframework.jdbc.core: WARN
    org.springframework.web.servlet.mvc.method.annotation: WARN
    org.springframework.web.reactive.function.client: WARN
    org.springframework.http.codec: WARN
    org.springframework.core.codec: WARN
    org.springframework.web.HttpLogging: WARN
    org.springframework.security.oauth2.client: WARN
    reactor.netty.http.client: WARN
    okhttp3: WARN
    retrofit2: WARN
    io.livekit.server: WARN
    # Broker reply text can contain private locators; report only fixed outcome metrics.
    com.rabbitmq.client: "OFF"

quizopia.proctoring.monitoring:
  enabled: ${PROCTORING_ENABLED:false}
  assessment-base-url: ${PROCTORING_ASSESSMENT_BASE_URL:}
  retention-days: ${PROCTORING_RETENTION_DAYS:}
  retention-policy-reference: ${PROCTORING_RETENTION_POLICY_REFERENCE:}
  privacy-approval-reference: ${PROCTORING_PRIVACY_APPROVAL_REFERENCE:}

# Disabled until exact provider revocation and monitoring policy acceptance; no SDK defaults.
quizopia.proctoring.media:
  enabled: ${PROCTORING_MEDIA_ENABLED:false}
  worker-enabled: ${PROCTORING_MEDIA_WORKER_ENABLED:false}
  api-url: ${PROCTORING_MEDIA_API_URL:}
  public-url: ${PROCTORING_MEDIA_PUBLIC_URL:}
  api-key: ${PROCTORING_MEDIA_API_KEY:}
  api-secret: ${PROCTORING_MEDIA_API_SECRET:}
  allow-insecure-loopback: ${PROCTORING_MEDIA_ALLOW_INSECURE_LOOPBACK:false}
  revocation-mode: ${PROCTORING_MEDIA_REVOCATION_MODE:UNVERIFIED}
  qualification-reference: ${PROCTORING_MEDIA_QUALIFICATION_REFERENCE:}
  lease-duration: ${PROCTORING_MEDIA_LEASE_DURATION:PT10S}

quizopia.proctoring.assessment-events:
  enabled: ${PROCTORING_ASSESSMENT_EVENTS_ENABLED:false}
  host: ${PROCTORING_ASSESSMENT_EVENTS_HOST:}
  port: ${PROCTORING_ASSESSMENT_EVENTS_PORT:5671}
  virtual-host: ${PROCTORING_ASSESSMENT_EVENTS_VHOST:}
  publisher-identity: ${PROCTORING_ASSESSMENT_EVENTS_PUBLISHER_IDENTITY:}
  username: ${PROCTORING_ASSESSMENT_EVENTS_USERNAME:}
  password: ${PROCTORING_ASSESSMENT_EVENTS_PASSWORD:}
  tls: ${PROCTORING_ASSESSMENT_EVENTS_TLS:true}
  allow-insecure-loopback: ${PROCTORING_ASSESSMENT_EVENTS_ALLOW_INSECURE_LOOPBACK:false}
