spring:
  config:
    activate:
      on-profile: local
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
quizopia:
  identity:
    email-outbox:
      dispatcher:
        enabled: ${IDENTITY_EMAIL_OUTBOX_DISPATCHER_ENABLED:true}
        from-address: ${IDENTITY_EMAIL_FROM_ADDRESS:no-reply@quizopia.local}
