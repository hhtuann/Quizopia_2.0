openapi: 3.1.0
info:
  title: Assessment private quiz revocation fence
  version: 1.0.0
  description: >-
    FB-015 PR B (ADR-018 Phase A steps 2-3) narrow private capability, default disabled via
    quizopia.deletion.enabled. Never routed through the Gateway. Independent RS256 SERVICE
    authentication requires the exact configured Quiz deletion client identity and the dedicated
    quiz.deletion.revoke scope. Transport is strictly bounded: no query string, no Cookie,
    no Transfer-Encoding/Content-Encoding, no forged identity headers, exactly one
    application/json Content-Type, body capped at 16384 bytes, strict duplicate-key and
    trailing-token JSON rejection, 1..50 unique canonical operation/quiz UUIDs. Every response
    is Cache-Control: no-store and sanitized: no quiz content, answers, locator secrets, PII
    or per-row data. Row presence in quiz_revocation_fences is the revocation fence; every
    quiz-scoped Assessment route then denies with the stable non-disclosing 404
    ASSESSMENT_REMOVED, including idempotent replay responses. Production activation is not
    authorized by this contract.
paths:
  /internal/security/quiz-revocations/batch:
    post:
      operationId: applyQuizRevocations
      x-required-service-scope: quiz.deletion.revoke
      x-required-service-client: exact configured Quiz deletion client identity
      description: >-
        Installs durable quiz-ID revocation fences idempotently. Installation first takes the
        affected publications row locks in deterministic order, so every in-flight
        START/SAVE/SUBMIT either commits before the fence (rows remain for later purge) or is
        denied after it; revoked_at is sampled from the database clock only after those locks
        are held. Redelivery of the same operation id, or a successor operation for an already
        revoked quiz, is classified as alreadyRevoked and never creates duplicate fences. One
        ADR-009 deletion_command_inbox row per operation records dedup and processing receipt
        in the same transaction. Responses carry no counts or content.
      security:
        - serviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [operations]
              properties:
                operations:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    additionalProperties: false
                    required: [operationId, quizId]
                    properties:
                      operationId:
                        type: string
                        format: uuid
                        pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
                      quizId:
                        type: string
                        format: uuid
                        pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      responses:
        "200":
          description: Sanitized classification; never content or PII.
          headers:
            Cache-Control:
              schema:
                const: no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [accepted, alreadyRevoked]
                properties:
                  accepted:
                    type: array
                    items:
                      $ref: "#/components/schemas/Revocation"
                  alreadyRevoked:
                    type: array
                    items:
                      $ref: "#/components/schemas/Revocation"
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429":
          description: Rolling per-minute caller budget exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { code: REVOCATION_RATE_LIMITED }
        "503":
          description: Capability disabled or persistence unavailable; never a success claim.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { code: AUTHORITY_UNAVAILABLE }
  /internal/security/quiz-revocations/{quizId}/status:
    get:
      operationId: readQuizRevocationStatus
      x-required-service-scope: quiz.deletion.revoke
      x-required-service-client: exact configured Quiz deletion client identity
      description: >-
        Truthful per-quiz acknowledgment state for the Quiz deletion coordinator. No request
        body, no query string, same strict transport. acknowledgedAt is set only by the bounded
        background verifier after it holds the affected publication row locks and confirms no
        committed mutation timestamp (attempt answers, grades, operation receipts, finalization
        audit, creation receipts) postdates revoked_at; an unacknowledged fence is never
        reported as acknowledged access revocation. Counts are aggregate only.
      security:
        - serviceBearer: []
      parameters:
        - in: path
          name: quizId
          required: true
          schema:
            type: string
            format: uuid
            pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      responses:
        "200":
          description: Aggregate fence state; no content or PII.
          headers:
            Cache-Control:
              schema:
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No revocation fence exists for this quiz.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { code: REVOCATION_NOT_FOUND }
        "429":
          description: Rolling per-minute caller budget exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { code: REVOCATION_RATE_LIMITED }
        "503":
          description: Capability disabled or persistence unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { code: AUTHORITY_UNAVAILABLE }
  /internal/security/quiz-revocations/{quizId}/dependents:
    get:
      operationId: readQuizRevocationDependents
      x-required-service-scope: quiz.deletion.purge
      x-required-service-client: exact configured Quiz deletion client identity
      description: >-
        FB-015 correction H5: complete dependent publication/attempt id inventory for one
        quiz from Assessment-owned tables (every publication state including drafts and
        private-locator rows, plus every attempt). Purge-support read consumed by the Quiz
        deletion coordinator so Proctoring can resolve legacy pre-V4 sessions whose quiz_id
        is NULL without any cross-service database join - therefore the dedicated
        quiz.deletion.purge scope (never the plain revocation scope) is required. Ids only:
        never titles, content, locators or PII. Read-only; never finalizes work.
      security:
        - serviceBearer: []
      parameters:
        - in: path
          name: quizId
          required: true
          schema:
            type: string
            format: uuid
            pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      responses:
        "200":
          description: Dependent id inventory; counts only, no content or PII.
          headers:
            Cache-Control:
              schema:
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dependents"
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No revocation fence exists for this quiz.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { code: REVOCATION_NOT_FOUND }
        "429":
          description: Rolling per-minute caller budget exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { code: REVOCATION_RATE_LIMITED }
        "503":
          description: Capability disabled or persistence unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { code: AUTHORITY_UNAVAILABLE }
components:
  schemas:
    Error:
      type: object
      required: [code]
      properties:
        code:
          type: string
    Revocation:
      type: object
      additionalProperties: false
      required: [quizId, operationId, revokedAt]
      properties:
        quizId:
          type: string
          format: uuid
        operationId:
          type: string
          format: uuid
        revokedAt:
          type: string
          format: date-time
    Status:
      type: object
      additionalProperties: false
      required: [quizId, revokedAt, publicationCount, attemptCount]
      properties:
        quizId:
          type: string
          format: uuid
        revokedAt:
          type: string
          format: date-time
        acknowledgedAt:
          type:
            - "null"
            - string
          format: date-time
        publicationCount:
          type: integer
          format: int64
          minimum: 0
        attemptCount:
          type: integer
          format: int64
          minimum: 0
    Dependents:
      type: object
      additionalProperties: false
      required: [quizId, publicationIds, attemptIds]
      properties:
        quizId:
          type: string
          format: uuid
        publicationIds:
          type: array
          items:
            type: string
            format: uuid
        attemptIds:
          type: array
          items:
            type: string
            format: uuid
  responses:
    Invalid:
      description: Malformed transport or body.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example: { code: INVALID_INTERNAL_REQUEST }
    Unauthenticated:
      description: SERVICE credential missing, invalid or expired.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example: { code: SERVICE_AUTHENTICATION_INVALID }
    Forbidden:
      description: Authenticated caller is not the exact configured Quiz deletion client.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example: { code: SERVICE_CALLER_FORBIDDEN }
  securitySchemes:
    serviceBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
