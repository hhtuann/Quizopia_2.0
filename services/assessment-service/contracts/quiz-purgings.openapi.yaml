openapi: 3.1.0
info:
  title: Assessment private quiz purge
  version: 2.0.0
  description: >-
    FB-015 PR C + Leader corrections (ADR-018 Phase B steps 6-7) narrow private capability,
    default disabled via quizopia.deletion.enabled. Never routed through the Gateway.
    Independent RS256 SERVICE authentication requires the exact configured Quiz deletion
    client identity and the dedicated quiz.deletion.purge scope. Transport is strictly
    bounded exactly like the revocation surface. The privileged purge procedure is the
    only path allowed to delete protected history: the runtime DB role holds no DELETE or
    TRUNCATE on it (see the service README provisioning section), every DELETE inside the
    procedure is bound to the target quiz's captured inventory, and no runtime DDL exists -
    the audited cyclic FKs were converted to NO ACTION DEFERRABLE INITIALLY DEFERRED at
    migration time. Each invocation is one transaction with a hard work-unit
    budget (quizopia.deletion.purge-budget, default 5000, bounded 100..50000).
    Inventory capture consumes units; a deletion unit removes at most three content
    rows, including complete fixed-size FK cycles. Receipt/admission/progress work is
    bounded linearly with that budget plus fixed bookkeeping. An
    exhausted budget durably persists progress and answers IN_PROGRESS - PURGED (with the
    verified_zero receipt) is only produced by a final round whose zero-remaining
    verification passed in that same transaction. Receipts carry counts only.
paths:
  /internal/security/quiz-purgings/batch:
    post:
      operationId: purgeQuizzes
      x-required-service-scope: quiz.deletion.purge
      x-required-service-client: exact configured Quiz deletion client identity
      description: >-
        Runs one bounded purge round per requested operation. Requires an acknowledged
        revocation fence for exactly the (quizId, operationId) pair; an active retention
        hold yields BLOCKED_BY_RETENTION with every row kept. IN_PROGRESS means durable
        progress exists and the coordinator must invoke the next round. Idempotent: an
        already-purged quiz answers PURGED with unchanged cumulative receipts.
      security:
        - serviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [operations]
              properties:
                operations:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    additionalProperties: false
                    required: [operationId, quizId]
                    properties:
                      operationId:
                        type: string
                        format: uuid
                        pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
                      quizId:
                        type: string
                        format: uuid
                        pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      responses:
        "200":
          description: Sanitized per-operation purge state; never content or PII.
          headers:
            Cache-Control:
              schema:
                const: no-store
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PurgeResult"
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503":
          description: Capability disabled or persistence unavailable; never a success claim.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { code: AUTHORITY_UNAVAILABLE }
  /internal/security/quiz-purgings/{quizId}/status:
    get:
      operationId: readQuizPurgeStatus
      x-required-service-scope: quiz.deletion.purge
      x-required-service-client: exact configured Quiz deletion client identity
      description: >-
        Truthful per-quiz purge state. purged is true only when the verified_zero receipt
        exists; counts only, never content or PII.
      security:
        - serviceBearer: []
      parameters:
        - in: path
          name: quizId
          required: true
          schema:
            type: string
            format: uuid
            pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      responses:
        "200":
          description: Aggregate purge state.
          headers:
            Cache-Control:
              schema:
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurgeStatus"
        "404":
          description: No fence/purge state exists for this quiz.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { code: PURGE_NOT_FOUND }
        "503":
          description: Capability disabled or persistence unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { code: AUTHORITY_UNAVAILABLE }
components:
  schemas:
    Error:
      type: object
      required: [code]
      properties:
        code:
          type: string
    PurgeResult:
      type: object
      additionalProperties: false
      required: [operationId, quizId, status, steps]
      properties:
        operationId:
          type: string
          format: uuid
        quizId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PURGED, IN_PROGRESS, BLOCKED_BY_RETENTION, WAITING_REVOCATION_ACK]
        steps:
          type: object
          additionalProperties:
            type: integer
            format: int64
            minimum: 0
          description: Cumulative rows-removed counts per step; counts only.
    PurgeStatus:
      type: object
      additionalProperties: false
      required: [quizId, revokedAt, purged, retentionHoldActive, steps]
      properties:
        quizId:
          type: string
          format: uuid
        revokedAt:
          type: string
          format: date-time
        acknowledgedAt:
          type:
            - "null"
            - string
          format: date-time
        purged:
          type: boolean
        retentionHoldActive:
          type: boolean
        steps:
          type: object
          additionalProperties:
            type: integer
            format: int64
            minimum: 0
  responses:
    Invalid:
      description: Malformed transport or body.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example: { code: INVALID_INTERNAL_REQUEST }
    Unauthenticated:
      description: SERVICE credential missing, invalid or expired.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example: { code: SERVICE_AUTHENTICATION_INVALID }
    Forbidden:
      description: Authenticated caller is not the exact configured Quiz deletion client.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example: { code: SERVICE_CALLER_FORBIDDEN }
  securitySchemes:
    serviceBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
