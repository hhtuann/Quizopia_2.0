      type: object
      additionalProperties: false
      required:
        - type
        - value
      properties:
        type:
          const: NUMERIC_FILL
        value:
          type:
            - string
            - "null"
          maxLength: 64
          description:
            Null/ASCII-trimmed blank unanswered; otherwise exactly 4 characters matching full ADR-013
            grammar (?:-?[0-9]+(?:[.][0-9]+)?|-[.][0-9]+). Outer ASCII whitespace only; preserve spelling. Semantic
            validation required before mutation.
          pattern: ^[\u0009-\u000d\u0020]*(?:[0-9]{4}|-[0-9]{3}|[0-9][.][0-9]{2}|[0-9]{2}[.][0-9]|-[0-9][.][0-9]|-[.][0-9]{2})?[\u0009-\u000d\u0020]*$
