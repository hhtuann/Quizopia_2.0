components:
  securitySchemes:
    userBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        code:
          type: string
          enum:
            - INVALID_REQUEST
            - UNAUTHENTICATED
            - ACCESS_DENIED
            - PUBLICATION_NOT_FOUND
            - SOURCE_NOT_ACCESSIBLE
            - CLASSROOM_NOT_ACCESSIBLE
            - PUBLICATION_CONFLICT
            - IDEMPOTENCY_CONFLICT
            - AUTHORITY_UNAVAILABLE
            - DEPENDENCY_UNAVAILABLE
            - PERSISTENCE_UNAVAILABLE
    Configuration:
      type: object
      additionalProperties: false
      required:
        - title
        - quizId
        - quizVersionId
        - versionNumber
        - audience
        - startAt
        - endAt
        - durationMinutes
        - monitoringChoice
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        description:
          type:
            - string
            - "null"
          maxLength: 5000
        quizId: *id002
        quizVersionId: *id002
        versionNumber:
          type: integer
          minimum: 1
          maximum: 999999999
        audience:
          type: string
          enum:
            - CLASS
            - PUBLIC
        classroomId:
          type:
            - string
            - "null"
          format: uuid
        startAt: &id012
          type: string
          format: date-time
          description: Explicit timezone offset; at most six fractional digits.
        endAt: *id012
        durationMinutes:
          oneOf:
            - type: integer
              const: 0
            - type: integer
              minimum: 5
              maximum: 240
          description:
            0 unlimited; otherwise 5..240 minutes. OPEN mode cannot switch; extensions never recalculate
            existing Attempt deadlines.
        monitoringChoice:
          type: string
          enum:
            - UNCONFIGURED
            - ENABLED
            - DISABLED
        maxAttempts:
          type: integer
          minimum: 0
          maximum: 10
          default: 1
          description:
            Omission defaults to 1, including legacy JSON. Explicit null invalid. 0 unlimited; 1..10
            finite. Mutable only in DRAFT; freezes OPEN.
      description:
        PUBLIC requires monitoring DISABLED. Unlimited CLASS may remain UNCONFIGURED in DRAFT but must
        choose DISABLED before OPEN; ENABLED is invalid. startAt<endAt required. New writes include effective maxAttempts;
        legacy OPEN JSON is preserved.
    OwnerView:
      type: object
      additionalProperties: false
      required:
        - publicationId
        - configuration
        - state
        - revision
        - createdAt
        - openedAt
        - privateLocator
      properties:
        publicationId: *id002
        configuration:
          $ref: "#/components/schemas/Configuration"
        state:
          type: string
          enum:
            - DRAFT
            - OPEN
            - CLOSED
        revision:
          type: integer
          minimum: 0
        createdAt: *id012
        openedAt:
          type:
            - string
            - "null"
          format: date-time
          description: Explicit timezone offset; at most six fractional digits.
        privateLocator:
          type:
            - string
            - "null"
          pattern: ^[A-Za-z0-9_-]{43}$
    StudentView:
      type: object
      additionalProperties: false
      required:
        - publicationId
        - title
        - description
        - audience
        - startAt
        - endAt
        - durationMinutes
        - monitoringRequired
        - windowStatus
      properties:
        publicationId: *id002
        title:
          type: string
        description:
          type:
            - string
            - "null"
        audience:
          type: string
          enum:
            - CLASS
            - PUBLIC
        startAt: *id012
        endAt: *id012
        durationMinutes:
          oneOf:
            - type: integer
              const: 0
            - type: integer
              minimum: 5
              maximum: 240
          description:
            0 unlimited; otherwise 5..240 minutes. OPEN mode cannot switch; extensions never recalculate
            existing Attempt deadlines.
        monitoringRequired:
          type: boolean
        windowStatus:
          type: string
          enum:
            - BEFORE_START
            - AVAILABLE
            - WINDOW_ENDED
    Update:
      type: object
      additionalProperties: false
      required:
        - expectedRevision
        - configuration
      properties:
        expectedRevision: &id013
          type: integer
          minimum: 0
        configuration:
          $ref: "#/components/schemas/Configuration"
    Open:
      type: object
      additionalProperties: false
      required:
        - expectedRevision
      properties:
        expectedRevision: *id013
    Schedule:
      type: object
      additionalProperties: false
      required:
        - expectedRevision
        - endAt
        - durationMinutes
      properties:
        expectedRevision: *id013
        endAt: *id012
        durationMinutes:
          oneOf:
            - type: integer
              const: 0
            - type: integer
              minimum: 5
              maximum: 240
          description:
            0 unlimited; otherwise 5..240 minutes. OPEN mode cannot switch; extensions never recalculate
            existing Attempt deadlines.
    Entry:
      type: object
      additionalProperties: false
      required:
        - locator
      properties:
        locator:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
    AttemptView:
      type: object
      additionalProperties: false
      required:
        - attemptId
        - publicationId
        - ordinal
        - state
        - startedAt
        - deadlineAt
        - durationMinutes
        - revision
        - serverNow
        - questions
        - answers
        - closure
      properties:
        attemptId: &id014
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        publicationId: *id014
        ordinal:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          description: Positive signed-64-bit ordinal encoded as decimal string; reject overflow.
        state:
          type: string
