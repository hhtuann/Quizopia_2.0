  /api/assessments/publications/{publicationId}/attempts/start:
    post:
      operationId: startAttempt
      x-contract-status: IMPLEMENTED_DEFAULT_DISABLED_PENDING_REVIEW
      x-required-user-role: STUDENT
      description:
        STUDENT USER, independent JWT/current LD-05 admission at Gateway and Assessment. PUBLIC locator
        required in body and must resolve to path Publication; CLASS locator omitted. Existing selection does not
        create a retake; matching replay returns original Attempt identity current view with 200.
      parameters:
        - name: publicationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{16,128}$
          description: Exactly one durable operation identity; scope/digest/replay defined by HTTP contract.
      responses:
        "200":
          description: Success or authorized durable replay; no-store.
          headers: &id003
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Required for every success/error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttemptView"
        "201":
          description: First Attempt created atomically.
          headers: *id003
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttemptView"
        "400":
          description: Malformed schema/reference/answer/query; no business mutation.
          headers: *id003
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentError"
        "401":
          description: Missing/invalid/expired USER credentials or independently invalid USER evidence.
          headers: *id003
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentError"
        "403":
          description: Wrong principal or missing issued/current role; never a SERVICE substitute.
          headers: *id003
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentError"
        "404":
          description: Missing or inaccessible resource masked; ownership/member/locator checked before state.
          headers: *id003
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentError"
        "409":
          description: Serialized revision, replay, eligibility or lifecycle conflict; fixed code, no identities/counts.
          headers: *id003
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentError"
        "429":
          description: Reserved for a deployed operational throttle; this application increment does not install one. Entitlement unchanged. Retry the same key after backoff.
          headers: *id003
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentError"
        "503":
          description:
            Required authority/dependency/persistence/grading unavailable. No refresh invalidation or
            fallback.
          headers: *id003
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentError"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartRequest"
      x-required-feature-flags:
        - ATTEMPTS_ENABLED
