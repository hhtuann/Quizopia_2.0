openapi: 3.1.0
info:
  title: Assessment Publication, Attempt, closure and inbox backend
  version: 1.3.0
  description:
    Implemented W3-A/B1/C1/B2/B3, default disabled pending independent security/runtime review and Leader
    merge approval. Gateway and Assessment independently enforce RS256 USER issued/current role and LD-05 admission.
    Teacher commands/results require persisted ownership. Attempt operations retain current CLASS membership; inbox
    requires recipient ownership without CLASS, locator, OPEN or ACTIVE predicates. Review requires durable CLOSED.
    CLOSURE_ENABLED and ASSESSMENT_INBOX_ENABLED are independent default-false controls. No production activation
    authorized.
paths:
  /api/assessments/publications:
    post:
      operationId: createPublication
      description:
        TEACHER USER required; owner check for management. Schedule supports nondecreasing end/duration
        only; start fixed.
      security:
        - userBearer: []
      responses:
        "201":
          description: Success; never reusable authorization.
          headers:
            Cache-Control: &id001
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerView"
        "400":
          description: Malformed request.
          headers:
            Cache-Control: *id001
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid SERVICE authentication or independently invalid USER evidence; inspect fixed code.
          headers:
            Cache-Control: *id001
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Wrong principal, client, scope or role.
          headers:
            Cache-Control: *id001
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Missing or inaccessible resource; no enumeration.
          headers:
            Cache-Control: *id001
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Revision or creation replay conflict.
          headers:
            Cache-Control: *id001
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Required authority/dependency unavailable or untrustworthy.
          headers:
            Cache-Control: *id001
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{16,128}$
          description: Durable owner-scoped replay key. Same key with different typed request conflicts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Configuration"
