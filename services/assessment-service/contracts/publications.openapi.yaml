openapi: 3.1.0
info:
  title: Assessment Publication backend
  version: 1.1.0
  description:
    Implemented W3-A plus W3-B1 Publication configuration, pending independent implementation
    review. Default disabled. maxAttempts defaults to 1; duration 0 is unlimited. Current and issued role
    plus independent LD-05 admission required at Gateway and Assessment. CLOSE/Attempts/results/review
    remain denied; discovery is metadata only.
paths:
  /api/assessments/publications:
    post:
      operationId: createPublication
      description:
        TEACHER USER required; owner check for management. Schedule supports nondecreasing
        end/duration only; start fixed.
      security:
        - userBearer: []
      responses:
        "201":
          description: Success; never reusable authorization.
          headers:
            Cache-Control: &id001
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerView"
        "400":
          description: Malformed request.
          headers:
            Cache-Control: *id001
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description:
            Invalid SERVICE authentication or independently invalid USER evidence; inspect
            fixed code.
          headers:
            Cache-Control: *id001
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Wrong principal, client, scope or role.
          headers:
            Cache-Control: *id001
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Missing or inaccessible resource; no enumeration.
          headers:
            Cache-Control: *id001
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Revision or creation replay conflict.
          headers:
            Cache-Control: *id001
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Required authority/dependency unavailable or untrustworthy.
          headers:
            Cache-Control: *id001
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{16,128}$
          description: Durable owner-scoped replay key. Same key with different typed request conflicts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Configuration"
