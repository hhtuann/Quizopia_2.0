        - $ref: "#/components/schemas/MatrixAnswer"
        - $ref: "#/components/schemas/NumericAnswer"
      discriminator:
        propertyName: type
        mapping:
          SINGLE_CHOICE: "#/components/schemas/SingleAnswer"
          MULTIPLE_CHOICE: "#/components/schemas/MultipleAnswer"
          TRUE_FALSE_MATRIX: "#/components/schemas/MatrixAnswer"
          NUMERIC_FILL: "#/components/schemas/NumericAnswer"
