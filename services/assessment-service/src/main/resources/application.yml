spring:
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-trailing-tokens: true
      accept-float-as-int: false
  application:
    name: quizopia-assessment-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  main:
    web-application-type: servlet
  datasource:
    hikari:
      connection-timeout: 3000
      validation-timeout: 1000
      data-source-properties:
        socketTimeout: 5
        loginTimeout: 3
    url: ${DB_URL:jdbc:postgresql://localhost:5432/assessment_db}
    username: ${DB_USERNAME:assessment}
    password: ${DB_PASSWORD:assessment_local_only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8081/oauth2/jwks}
          issuer-uri: ${IDENTITY_ISSUER:http://localhost:8081}
server:
  port: ${SERVER_PORT:8084}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  tracing:
    export:
      otlp:
        enabled: ${OTEL_EXPORTER_OTLP_ENABLED:false}
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_ARG:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:true}

quizopia:
  assessment:
    transactions:
      timeout-seconds: ${ATTEMPT_TRANSACTION_TIMEOUT_SECONDS:15}
      statement-millis: ${ATTEMPT_STATEMENT_TIMEOUT_MILLIS:3000}
      lock-millis: ${ATTEMPT_LOCK_TIMEOUT_MILLIS:3000}
    proctoring-authority:
      target-eligibility-enabled: ${ASSESSMENT_PROCTORING_TARGET_ELIGIBILITY_ENABLED:false}
      enabled: ${ASSESSMENT_PROCTORING_AUTHORITY_ENABLED:false}
      client-id: ${ASSESSMENT_PROCTORING_CLIENT_ID:}
      allow-insecure-loopback: ${ASSESSMENT_PROCTORING_ALLOW_INSECURE_LOOPBACK:false}
    realtime-authority:
      enabled: ${ASSESSMENT_REALTIME_AUTHORITY_ENABLED:false}
      gateway-client-id: ${ASSESSMENT_REALTIME_GATEWAY_CLIENT_ID:}
      allow-insecure-loopback: ${ASSESSMENT_REALTIME_AUTHORITY_ALLOW_INSECURE_LOOPBACK:false}
    features:
      attempts-enabled: ${ATTEMPTS_ENABLED:false}
      results-enabled: ${RESULTS_ENABLED:false}
      closure-enabled: ${CLOSURE_ENABLED:false}
  publication:
    enabled: ${PUBLICATION_ENABLED:false}
    sources:
      enabled: ${PUBLICATION_SOURCES_ENABLED:false}
      quiz-base-url: ${PUBLICATION_QUIZ_BASE_URL:}
      classroom-base-url: ${PUBLICATION_CLASSROOM_BASE_URL:}
  admission:
    enabled: ${USER_ADMISSION_ENABLED:false}
    identity-base-url: ${USER_ADMISSION_IDENTITY_BASE_URL:}
    client-id: ${USER_ADMISSION_CLIENT_ID:}
    client-secret: ${USER_ADMISSION_CLIENT_SECRET:}
    allow-insecure-loopback: ${USER_ADMISSION_ALLOW_INSECURE_LOOPBACK:false}
    connect-timeout: ${USER_ADMISSION_CONNECT_TIMEOUT:PT1S}
    response-timeout: ${USER_ADMISSION_RESPONSE_TIMEOUT:PT3S}
    total-timeout: ${USER_ADMISSION_TOTAL_TIMEOUT:PT5S}
    max-connections: ${USER_ADMISSION_MAX_CONNECTIONS:8}
    pending-acquires: ${USER_ADMISSION_PENDING_ACQUIRES:32}
  # FB-012 owner-results display-name enrichment; default OFF, fail-open, zero cache.
  student-profiles:
    enabled: ${ASSESSMENT_STUDENT_PROFILE_ENABLED:false}
    connect-timeout: ${ASSESSMENT_STUDENT_PROFILE_CONNECT_TIMEOUT:PT2S}
    response-timeout: ${ASSESSMENT_STUDENT_PROFILE_RESPONSE_TIMEOUT:PT2S}
    total-timeout: ${ASSESSMENT_STUDENT_PROFILE_TOTAL_TIMEOUT:PT5S}
    max-connections: ${ASSESSMENT_STUDENT_PROFILE_MAX_CONNECTIONS:4}
    pending-acquires: ${ASSESSMENT_STUDENT_PROFILE_PENDING_ACQUIRES:16}

# Dedicated credential clients must remain redacted even when root logging is DEBUG/TRACE.
logging:
  level:
    # Tomcat HTTP decoder DEBUG/TRACE includes complete credential headers and bodies.
    org.apache.coyote.http11: WARN
    # Hibernate factory diagnostics dump configuration; bind diagnostics dump values.
    org.hibernate.orm.factory: WARN
    org.hibernate.orm.jdbc.bind: WARN
    # JDBC TRACE parameter binding can disclose durable answers/receipts.
    org.springframework.jdbc.core: WARN
    org.springframework.web.reactive.function.client: WARN
    org.springframework.http.codec: WARN
    org.springframework.core.codec: WARN
    org.springframework.web.HttpLogging: WARN
    org.springframework.security.oauth2.client: WARN
    reactor.netty.http.client: WARN
    # Private AMQP diagnostics can expose deployment credentials/locators; use fixed outcome metrics.
    com.rabbitmq.client: "OFF"
    org.springframework.web.servlet.mvc.method.annotation: WARN

# B3 remains disabled until authenticated topology and recipient provisioning are verified.
quizopia.assessment.closure:
  inbox-enabled: ${ASSESSMENT_INBOX_ENABLED:false}
  worker-enabled: ${ASSESSMENT_CLOSURE_WORKER_ENABLED:false}
  edge-inbox-verified: ${ASSESSMENT_EDGE_INBOX_VERIFIED:false}
  recipient-enabled: ${ASSESSMENT_RECIPIENT_ELIGIBILITY_ENABLED:false}
  unit-budget: ${ASSESSMENT_CLOSURE_UNIT_BUDGET:50}
  scan-limit: ${ASSESSMENT_CLOSURE_SCAN_LIMIT:50}
  cursor-active-key: ${ASSESSMENT_CURSOR_ACTIVE_KEY:v1}
  cursor-keys:
    v1: ${ASSESSMENT_CURSOR_KEY_V1:}
  edge-base-url: ${ASSESSMENT_EDGE_BASE_URL:}

# Technical metadata only; production capture/transport remains blocked pending privacy acceptance.
quizopia.assessment.monitoring-events:
  capture-enabled: ${ASSESSMENT_MONITORING_CAPTURE_ENABLED:false}
  publisher-enabled: ${ASSESSMENT_MONITORING_PUBLISHER_ENABLED:false}
  allow-insecure-loopback: ${ASSESSMENT_MONITORING_ALLOW_INSECURE_LOOPBACK:false}
  host: ${ASSESSMENT_MONITORING_BROKER_HOST:}
  port: ${ASSESSMENT_MONITORING_BROKER_PORT:5671}
  virtual-host: ${ASSESSMENT_MONITORING_BROKER_VHOST:}
  username: ${ASSESSMENT_MONITORING_BROKER_USERNAME:}
  password: ${ASSESSMENT_MONITORING_BROKER_PASSWORD:}

# W4-B3 realtime invalidation outbox; independent from monitoring. Default OFF at both boundaries.
quizopia.assessment.realtime-invalidation:
  capture-enabled: ${ASSESSMENT_REALTIME_INVALIDATION_CAPTURE_ENABLED:false}
  publisher-enabled: ${ASSESSMENT_REALTIME_INVALIDATION_PUBLISHER_ENABLED:false}
  allow-insecure-loopback: ${ASSESSMENT_REALTIME_INVALIDATION_ALLOW_INSECURE_LOOPBACK:false}
  host: ${ASSESSMENT_REALTIME_INVALIDATION_BROKER_HOST:}
  port: ${ASSESSMENT_REALTIME_INVALIDATION_BROKER_PORT:5671}
  virtual-host: ${ASSESSMENT_REALTIME_INVALIDATION_BROKER_VHOST:}
  username: ${ASSESSMENT_REALTIME_INVALIDATION_BROKER_USERNAME:}
  password: ${ASSESSMENT_REALTIME_INVALIDATION_BROKER_PASSWORD:}
  claim-batch: ${ASSESSMENT_REALTIME_INVALIDATION_CLAIM_BATCH:5}
  max-delivery-attempts: ${ASSESSMENT_REALTIME_INVALIDATION_MAX_DELIVERY_ATTEMPTS:10}
  poll-delay-seconds: ${ASSESSMENT_REALTIME_INVALIDATION_POLL_DELAY_SECONDS:1}
