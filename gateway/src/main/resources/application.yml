spring:
  application:
    name: quizopia-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  main:
    web-application-type: reactive
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8081/oauth2/jwks}
          issuer-uri: ${IDENTITY_ISSUER:http://localhost:8081}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-service
              uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
              predicates: [Path=/api/auth/**]
            - id: quiz-service
              uri: ${QUIZ_SERVICE_URL:http://localhost:8082}
              predicates: [Path=/api/quizzes/**]
            - id: classroom-create
              uri: ${CLASSROOM_SERVICE_URL:http://localhost:8083}
              predicates: [Path=/classrooms, Method=POST]
            - id: classroom-owned-read
              uri: ${CLASSROOM_SERVICE_URL:http://localhost:8083}
              predicates: ["Path=/classrooms/{classroomId}", Method=GET]
            - id: classroom-service
              uri: ${CLASSROOM_SERVICE_URL:http://localhost:8083}
              predicates: [Path=/api/classes/**]
            - id: assessment-service
              uri: ${ASSESSMENT_SERVICE_URL:http://localhost:8084}
              predicates: [Path=/api/assessments/**]
            - id: community-service
              uri: ${COMMUNITY_SERVICE_URL:http://localhost:8085}
              predicates: [Path=/api/community/**]
            - id: proctoring-service
              uri: ${PROCTORING_SERVICE_URL:http://localhost:8086}
              predicates: [Path=/api/proctoring/**]
            - id: ai-service
              uri: ${AI_SERVICE_URL:http://localhost:8087}
              predicates: [Path=/api/ai/**]
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
quizopia:
  publication:
    enabled: ${PUBLICATION_ENABLED:false}
  admission:
    enabled: ${USER_ADMISSION_ENABLED:false}
    identity-base-url: ${USER_ADMISSION_IDENTITY_BASE_URL:}
    client-id: ${USER_ADMISSION_CLIENT_ID:}
    client-secret: ${USER_ADMISSION_CLIENT_SECRET:}
    allow-insecure-loopback: ${USER_ADMISSION_ALLOW_INSECURE_LOOPBACK:false}
    connect-timeout: ${USER_ADMISSION_CONNECT_TIMEOUT:PT1S}
    response-timeout: ${USER_ADMISSION_RESPONSE_TIMEOUT:PT3S}
    total-timeout: ${USER_ADMISSION_TOTAL_TIMEOUT:PT5S}
    max-connections: ${USER_ADMISSION_MAX_CONNECTIONS:8}
    pending-acquires: ${USER_ADMISSION_PENDING_ACQUIRES:32}
  gateway:
    browser:
      allowed-origins: ${GATEWAY_ALLOWED_ORIGINS:http://localhost:3000}
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  tracing:
    export:
      otlp:
        enabled: ${OTEL_EXPORTER_OTLP_ENABLED:false}
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_ARG:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

# Dedicated credential clients must remain redacted even when root logging is DEBUG/TRACE.
logging:
  level:
    org.springframework.web.reactive.function.client: WARN
    org.springframework.http.codec: WARN
    org.springframework.core.codec: WARN
    org.springframework.web.HttpLogging: WARN
    org.springframework.security.oauth2.client: WARN
    reactor.netty.http.client: WARN

# B2 independently gated at the edge and downstream. B3 has independent closure/inbox controls.
quizopia.assessment.features:
  attempts-enabled: ${ATTEMPTS_ENABLED:false}
  results-enabled: ${RESULTS_ENABLED:false}
  closure-enabled: ${CLOSURE_ENABLED:false}

# B3 remains disabled until authenticated topology and recipient provisioning are verified.
quizopia.assessment.closure:
  inbox-enabled: ${ASSESSMENT_INBOX_ENABLED:false}

# Readiness group exposes only a status, never account or notification data.
management.endpoint.health.group.assessment-inbox:
  include: assessmentInbox
  show-details: never
  show-components: never

quizopia.proctoring.enabled: ${PROCTORING_ENABLED:false}
