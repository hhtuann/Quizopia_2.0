name: W4F private synthetic demo
on:
  pull_request:
    paths: ['frontend/**', 'gateway/**', 'services/assessment-service/**', '.github/workflows/w4f-demo.yml']
  push:
    branches: [develop]
    paths: ['frontend/**', 'gateway/**', 'services/assessment-service/**', '.github/workflows/w4f-demo.yml']
permissions:
  contents: read
jobs:
  academic-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: chmod +x gateway/mvnw services/*/mvnw
      - run: ./mvnw -B -Dtest=AcademicDemoTopologyTest -Dw4f.demo=true test
        working-directory: gateway
      # Logs contain no request bodies/tokens and are checked by the harness;
      # no browser traces, account cookies or disposable key files are uploaded.
