gates:
  - id: BUILD-02
    inherited_status: NOT VERIFIED
    status: NOT VERIFIED
    objective:
      Required backend CI and repository checks pass at the exact approved merged release-candidate
      SHA with verified merge and protection provenance.
    severity: MEDIUM
    release_blocking: true
    proposed_owner: Repository/CI owner
    dri: UNASSIGNED — LEADER ASSIGNMENT REQUIRED
    executor: Assigned repository maintainer with Actions/read-policy access
    independent_reviewer: Independent repository reviewer
    approval_authority: Repository policy owner; Leader selects the release candidate
    prerequisites:
      - Leader identifies the exact release-candidate commit; do not infer approval from merged develop.
      - Repository owner supplies actual required workflow/job policy and classic/ruleset protections.
    target_environment: GitHub repository Actions and branch-policy metadata; no deployment
    procedure:
      - 'Record git rev-parse origin/develop and git show --no-patch --format=fuller "$W3_RELEASE_SHA"; reconcile
        merge provenance to PR #84 or any later approved changes.'
      - With authorized repository tooling, paginate all-event Actions runs filtered to W3_RELEASE_SHA; retrieve
        every required run and job with checked SHA, event, conclusion and timestamps. Public run links already
        observed are partial evidence.
      - Retrieve develop classic protection and ruleset/required-check policies with authorized read access;
        compare successful jobs to the policy. If a required merged-SHA workflow is absent, owner authorizes
        the appropriate workflow dispatch/re-run at that exact SHA, records provenance, and waits for completed
        results.
      - "Independently review policy-to-job coverage; do not substitute successful PR #84 head runs or PR-only
        connector results."
    pass_criteria:
      - Exact approved release_candidate_sha matches every required backend/repository verification receipt.
      - Every policy-required workflow/job is completed success; failed, skipped, cancelled or absent required
        checks have no unexplained disposition.
      - Merge provenance and effective branch protection/required-check policy are recorded and independently
        reviewed.
    minimum_evidence:
      - Approved candidate SHA and merge provenance
      - Actual workflow run/job URLs, event, checked SHA and conclusions
      - Effective classic protection/ruleset and required-job inventory
      - Independent repository review and owner approval
    evidence: []
    approvals: []
    dependencies: []
    remediation:
      Resolve failing/missing required checks or absent policy access through repository ownership;
      retain NOT VERIFIED until exact coverage is established.
    execution_authorization:
      Read-only metadata inspection is authorized now. Any dispatch or policy mutation
      needs repository-owner authorization; this workstream must not weaken required checks.
    final_signoff:
      Repository policy owner approves coverage; Leader records exact RC selection. Neither
      CI success nor PR merge grants release GO.
    revalidate_on:
      - Release-candidate SHA changes
      - Required workflow/job or branch-policy changes
      - New rerun supersedes recorded evidence
    blocker:
      Exact merged-SHA successful runs are observed, but approved RC and effective required-check/protection
      policy evidence are unavailable.
    ownership_status: PROPOSED
