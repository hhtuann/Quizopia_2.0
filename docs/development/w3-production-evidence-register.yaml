  integrity:
    Use SHA-256 of the retained sanitized evidence manifest; record UTC execution timestamps
    and actual tool versions. Deployment receipts bind service image digests and a secret-free configuration
    fingerprint.
  references:
    Only actual retrievable HTTPS evidence URLs or existing repository-relative files. Never
    present a template, example URL, empty receipt or planned procedure as verified evidence. Sensitive
    evidence stays in approved restricted storage with a sanitized accessible reference.
  approval:
    Every PASS needs actual evidence and authorized gate approval. Independent review must be
    attributable to a person other than the executor. APPROVAL-01 additionally requires both independent
    security and Leader decisions for the exact candidate/environment/artifacts. Deployment approvals
    bind the exact same artifact digest and configuration fingerprint as the receipt. Independent Security
    and GATE_APPROVER reviewers must differ from the executor and assigned DRI; the Leader may also be
    the accountable DRI but cannot replace independent review.
  waiver:
    Only NOTICE-04 may become NOT APPLICABLE in this overlay, following a written Leader/Security
    soak waiver identifying decision maker, authority, risk, scope and expiry/review conditions. Both
    authority approvals and actual waiver evidence are required; no self-approved HIGH-impact waiver.
  trust_limit:
    Schema validation screens completeness, not truth or approval authority. The independent
    reviewer must retrieve evidence, verify integrity/source and confirm the decision maker has authority.
