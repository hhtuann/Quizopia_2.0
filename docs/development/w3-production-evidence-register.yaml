      - Record RC/digests/configuration/versions and approved workload, duration, thresholds and dataset distributions.
        Retain the 12,613-question fixture and test all accepted full-answer sizes and encoding/expansion
        cases.
      - Measure complete delivery and final answer HTTP body size against the initial 2 MiB engineering budget;
        verify no truncation, sanitized mutation-free oversize rejection and explicit resolution before accepting
        a snapshot that cannot safely submit. Preserve W3-A handoff limitations.
      - Run repeated target-concurrency START/RESUME/SAVE/SUBMIT and closure REQUEST/bounded batch/COMPLETE
        loads; compare complete persisted answers/results/receipts and atomic complete membership capture.
        Capacity failures must roll REQUEST back fully.
      - Collect heap/GC, pool occupancy/acquisition, CPU, locks, throughput, latency/error distribution, failure/retry/timeout
        and resource headroom. Include lost acknowledgments and multi-instance pressure; prove no duplicate
        terminalization or inconsistent grade/cutoff.
      - Review raw measurement provenance and full results against approved budgets. Do not invent an SLA/P95/P99
        or alter timeouts; any correction needs engineering evidence and explicit authorization before retest.
    pass_criteria:
      - Repeated approved target load meets written latency/error/resource/headroom budgets with reviewed
        test data and duration.
      - All accepted snapshots safely deliver and complete answer payloads submit without truncation; oversize
        rejection sanitized and mutation-free; 12,613-question fixture retained.
      - SAVE/SUBMIT and bounded closure throughput measured with heap/GC/JDBC/acquire/CPU/lock/failure/retry/timeout
        evidence.
      - No duplicate terminalization, loss of complete answers or partial successful membership capture under
        pressure; uncertain commits recover correctly.
    minimum_evidence:
      - Approved workload/duration/latency/error/resource thresholds and data distribution
      - Actual snapshot/full-answer/body expansion sizes and oversize invariant outcomes
      - Repeated load traces and heap/GC/pool/acquisition/CPU/lock measurements
      - SAVE/SUBMIT/closure throughput and failure/retry/timeout integrity report
      - Independent performance review and authorized budget decisions
    evidence: []
    approvals: []
    dependencies:
      - TLS-02
      - DB-05
    remediation:
      Resolve measured resource/capacity mismatch in separately reviewed work; do not truncate
      payloads, weaken atomicity, reduce the retained fixture or raise timeouts without approval/evidence.
    execution_authorization:
      Leader/Platform approve workload/budgets; Platform authorizes exact isolated
      target, synthetic data, pressure limits and stop criteria. No production load test authorized.
    final_signoff:
      Independent Backend/Platform accept reproducible measurements against approved budgets
      and complete-answer/integrity checks.
    revalidate_on:
