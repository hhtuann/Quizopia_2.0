            $ref: "#/components/schemas/Question"
          minItems: 1
        answers:
          type: array
          items:
            $ref: "#/components/schemas/AnswerEntry"
          minItems: 1
        closure:
          anyOf:
            - $ref: "#/components/schemas/AttemptClosure"
            - type: "null"
