# Frozen contract pack. Implementation status is recorded per operation; production activation is unauthorized.
openapi: 3.1.0
info:
  title: W3-B/W3-C engineering contracts — B2/B3 implemented, default disabled
  version: 1.0.0-default-disabled
  description:
    Leader-approved frozen engineering contracts; B2 and B3 operations implemented, default disabled
    pending independent implementation/security/runtime review. Engineering direction APPROVED WITH CONDITIONS EC79-01..04.
    Existing product policy unchanged. Production activation NOT AUTHORIZED. See B3 implementation evidence and
    sibling HTTP/lifecycle/closure/grading contracts.
x-contract-status: MIXED_IMPLEMENTATION_SEE_OPERATIONS
security:
  - userBearer: []
paths:
  /api/assessments/publications/{publicationId}/attempts/start:
    post:
      operationId: startAttempt
      x-contract-status: IMPLEMENTED_B2_DEFAULT_DISABLED_PENDING_REVIEW
      x-required-user-role: STUDENT
      description:
        STUDENT USER, independent JWT/current LD-05 admission at Gateway and Assessment. PUBLIC
        locator required in body and must resolve to path Publication; CLASS locator omitted. Existing
        selection does not create a retake; matching replay returns original Attempt identity current
        view with 200.
      parameters:
        - name: publicationId
          in: path
          required: true
          schema: &id002
            type: string
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        - &id003
          name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{16,128}$
          description: Exactly one durable operation identity; scope/digest/replay defined by HTTP contract.
      responses:
        "200":
          description: Success or authorized durable replay; no-store.
          headers: &id001
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Required for every success/error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttemptView"
        "201":
          description: First Attempt created atomically.
          headers: *id001
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttemptView"
        "400":
          description: Malformed schema/reference/answer/query; no business mutation.
          headers: *id001
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing/invalid/expired USER credentials or independently invalid USER evidence.
          headers: *id001
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Wrong principal or missing issued/current role; never a SERVICE substitute.
          headers: *id001
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description:
            Missing or inaccessible resource masked; ownership/member/locator checked before
            state.
          headers: *id001
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description:
            Serialized revision, replay, eligibility or lifecycle conflict; fixed code, no
            identities/counts.
          headers: *id001
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description:
            Sanitized deployment capacity throttle, entitlement unchanged. Retry same key after
            backoff.
          headers: *id001
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description:
            Required authority/dependency/persistence/grading unavailable. No refresh invalidation
            or fallback.
          headers: *id001
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartRequest"
