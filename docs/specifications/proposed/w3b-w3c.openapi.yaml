    Result:
      type: object
      additionalProperties: false
      required:
        - resultId
        - attemptId
        - publicationId
        - ordinal
        - earnedWeight
        - possibleWeight
        - percentageDisplay
        - gradingPolicyVersion
        - gradingPolicyId
        - terminalReason
        - finalizedAt
      properties:
        resultId: *id002
        attemptId: *id002
        publicationId: *id002
        ordinal: *id010
        earnedWeight: &id011
          type: string
          pattern: ^(0|[1-9][0-9]*)(\.[0-9]*[1-9])?$
          description: Exact nonnegative plain decimal, no exponent or unnecessary trailing zeros.
        possibleWeight:
          type: string
          pattern: ^[1-9][0-9]*$
          description: Positive integer question count, encoded as exact decimal string.
        percentageDisplay:
          type: string
          pattern: ^(100\.00|(?:[0-9]|[1-9][0-9])\.[0-9]{2})$
        gradingPolicyVersion:
          const: 1
